name: Serverless Deployment

on:
    push:
        branches:
            - master

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with: 
                role-to-assume: ${{ secrets.OIDC_IAM_ROLE_ARN }}
                role-session-name: PersonalSiteDeployment
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Install Node
              uses: actions/setup-node@v4
              with: 
                node-version: 22

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npm test
            
            - name: Build Code
              run: npm run build

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.9.8"

            - name: Terraform Init
              working-directory: ./terraform
              run: terraform init

            - name: Terraform Validate
              working-directory: ./terraform
              run: terraform validate

            - name: Terraform Plan
              id: plan
              working-directory: ./terraform
              run: terraform plan

            - name: Terraform Apply
              working-directory: ./terraform
              run: terraform apply -auto-approve

            - name: Get Terraform Outputs
              working-directory: ./terraform
              run: |
                echo "BUCKET_NAME=$(terraform output -raw module_bucket_name)" >> $GITHUB_ENV
                echo "CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw module_cloudfront_distribution_id)" >> $GITHUB_ENV

            - name: Upload Build Directory to S3
              run: aws s3 cp ./build s3://${{ env.BUCKET_NAME }}/ --recursive

            - name: Invalidate CloudFront Cache
              run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"